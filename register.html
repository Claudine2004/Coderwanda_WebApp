
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODERWANDA | Register</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f1f5f9; }
        header { background: #102a43; padding: 20px 8%; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #38bdf8; font-size: 23px; font-weight: bold; text-decoration: none; }
        nav a { color: white; text-decoration: none; margin-left: 20px; }
        .container { min-height: 80vh; display: flex; justify-content: center; align-items: center; padding: 25px; }
        .form-box { background: white; padding: 35px; width: 100%; max-width: 430px; border-radius: 12px; box-shadow: 0 4px 15px #00000015; }
        h1 { text-align: center; color: #102a43; }
        .subtitle { text-align: center; color: #64748b; margin-bottom: 20px; }
        label { display: block; margin: 13px 0 7px; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; }
        button { width: 100%; padding: 13px; background: #0284c7; color: white; border: none; border-radius: 6px; margin-top: 22px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0369a1; }
        .message { text-align: center; margin-top: 15px; }
        .login { text-align: center; margin-top: 20px; }
        .login a { color: #0284c7; }
        footer { background: #102a43; color: white; text-align: center; padding: 18px; }
        @media(max-width: 600px) { header { flex-direction: column; gap: 15px; } }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo">CODERWANDA</a>
    <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<div class="container">
    <div class="form-box">
        <h1>Create Account</h1>
        <p class="subtitle">Join CODERWANDA Ltd today.</p>

        <form id="registerForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Minimum 8 characters" minlength="8" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your password" required>

            <button type="submit">Register</button>
        </form>

        <p id="message" class="message" aria-live="polite"></p>

        <p class="login">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>
    </div>
</div>

<footer>
    <p>&copy; 2026 CODERWANDA Ltd.</p>
</footer>

<script>
    document.getElementById("registerForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim().toLowerCase();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const message = document.getElementById("message");

        if (password.length < 8) {
            message.style.color = "red";
            message.textContent = "Password must contain at least 8 characters.";
            return;
        }

        if (password !== confirmPassword) {
            message.style.color = "red";
            message.textContent = "Passwords do not match.";
            return;
        }

        const users = JSON.parse(localStorage.getItem("demoUsers") || "[]");

        if (users.some(user => user.email === email)) {
            message.style.color = "red";
            message.textContent = "This email is already registered.";
            return;
        }

        // Demonstration only; real applications must hash passwords on the server.
        users.push({ name, email, password });
        localStorage.setItem("demoUsers", JSON.stringify(users));

        message.style.color = "green";
        message.textContent = "Registration successful! You can now login.";

        document.getElementById("registerForm").reset();
    });
</script>

</body>
</html>
